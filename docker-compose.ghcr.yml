# =============================================================================
# Docker Compose - Production (GHCR Pull)
# =============================================================================
# VPS TIDAK build image. Image di-build oleh GitHub Actions, push ke GHCR.
# VPS hanya pull + run. Cocok untuk VPS spek rendah (1GB RAM).
#
# Usage di VPS:
#   docker compose -f docker-compose.ghcr.yml up -d
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: hris-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    security_opt:
      - seccomp:unconfined
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEM_LIMIT:-384m}
          cpus: ${MYSQL_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    # ⬇️ Image dari GitHub Container Registry (di-build oleh GitHub Actions)
    image: ghcr.io/${GHCR_REPO:-rizalibrah08/hris-management-system}:latest
    container_name: hris-web
    restart: always
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-1d}
      PORT: 5000
      NODE_ENV: production
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.npm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-256m}
          cpus: ${WEB_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mysql_data:
    driver: local

networks:
  internal:
    driver: bridge
