# Rate limiting — maksimal 5 request per menit ke endpoint login
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Maksimum body 16MB untuk upload foto (selfie, kwitansi)
    client_max_body_size 16m;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    # API endpoints — strip prefix /api sebelum diteruskan ke backend
    # Contoh: /api/auth/login → backend:5000/auth/login
    # ============================================================
    location /api/ {
        # Rate limit untuk endpoint login
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://web:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout untuk request yang lama (generate payroll, dll)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ============================================================
    # Health check endpoint
    # ============================================================
    location /health {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================================
    # Uploaded files (foto selfie, kwitansi, dll)
    # ============================================================
    location /uploads/ {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================================
    # Semua request lainnya → React SPA + static files
    # ============================================================
    location / {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Blokir akses ke file sensitif
    # ============================================================
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }
}
