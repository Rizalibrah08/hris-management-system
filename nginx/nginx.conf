# =============================================================================
# Nginx Reverse Proxy for HRIS
# =============================================================================
# Setup SSL:
#   1. Point your domain DNS to this server
#   2. Install certbot: apt install certbot python3-certbot-nginx
#   3. Run: certbot --nginx -d hris.yourdomain.com
#   4. Certbot will auto-update this config with SSL paths
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- Rate limiting ---
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # --- Upstream ---
    upstream hris_backend {
        server web:5000;
    }

    # =========================================================================
    # HTTP → HTTPS Redirect (uncomment after SSL is set up)
    # =========================================================================
    # server {
    #     listen 80;
    #     server_name hris.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # =========================================================================
    # HTTP (No SSL) - Use this until SSL is configured
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Increase body size for file uploads
        client_max_body_size 16m;

        # --- Rate limiting for auth endpoints ---
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://hris_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/register {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://hris_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API ---
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://hris_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://hris_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Health check ---
        location /health {
            proxy_pass http://hris_backend;
            proxy_http_version 1.1;
            access_log off;
        }

        # --- Static frontend ---
        location / {
            proxy_pass http://hris_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Security: block sensitive files ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.env$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
