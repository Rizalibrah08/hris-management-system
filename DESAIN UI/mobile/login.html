<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HRIS Mobile</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F3F4F6; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
.phone-container {
  position: relative;
}
.phone-frame {
  width: 399px; height: 852px;
  background: #1a1a1a;
  border-radius: 44px;
  padding: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 0 6px rgba(255,255,255,0.15);
}
.phone-notch {
  width: 120px; height: 28px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  z-index: 10;
}
.phone-screen {
  width: 375px; height: 812px;
  background: #f8f9fd;
  border-radius: 32px;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.phone-home-bar {
  width: 134px; height: 5px;
  background: #999;
  border-radius: 3px;
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
}
.scroll-area { flex: 1; overflow-y: auto; padding-bottom: 80px; }
.header {
  align-items: center;
  display: flex; flex-direction: column;
  margin-bottom: 30px;
}
.logo-box {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, #4b3ac3, #6c5ce7);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(75,58,195,0.3);
}
.logo-box span {
  color: #fff; font-size: 28px; font-weight: 800;
}
.app-title {
  font-size: 26px; font-weight: 800; color: #4b3ac3;
  margin-bottom: 4px;
}
.app-subtitle {
  font-size: 14px; color: #6b7280;
}
.error-box {
  display: flex; align-items: center; gap: 8px;
  background: #FEF2F2; padding: 12px; border-radius: 10px;
  margin-bottom: 16px; display: none;
}
.error-box.visible { display: flex; }
.error-box .dot { color: #EF4444; font-size: 18px; flex-shrink: 0; }
.error-box .msg { color: #EF4444; font-size: 13px; }
.input-wrapper { margin-bottom: 16px; }
.input-label {
  font-size: 13px; color: #374151; font-weight: 600; margin-bottom: 8px;
}
.input-container {
  display: flex; align-items: center;
  background: #e9ebf0;
  border: 1px solid #d4d7df;
  border-radius: 12px;
  padding: 0 16px; height: 48px;
}
.input-container:focus-within {
  border-color: #4b3ac3; background: #fff;
}
.input-icon {
  width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.input-icon svg { width: 20px; height: 20px; stroke: #4b3ac3; fill: none; stroke-width: 2; }
.text-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 15px; color: #111827;
}
.text-input::placeholder { color: #9ca3af; }
.eye-btn {
  background: none; border: none; cursor: pointer; padding: 4px;
  display: flex; align-items: center;
}
.eye-btn svg { width: 20px; height: 20px; stroke: #4b3ac3; fill: none; stroke-width: 2; }
.remember-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px; cursor: pointer;
}
.remember-row input[type=checkbox] { display: none; }
.checkbox-icon {
  width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid #4b3ac3; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.checkbox-icon.checked {
  background: #4b3ac3;
}
.checkbox-icon.checked::after {
  content: '\2713'; color: #fff; font-size: 14px; font-weight: bold;
}
.remember-label { font-size: 14px; color: #374151; }
.btn-primary {
  width: 100%; height: 50px;
  background: #4b3ac3; color: #fff;
  border: none; border-radius: 25px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  margin-bottom: 20px; margin-top: 8px;
  box-shadow: 0 6px 20px rgba(75,58,195,0.35);
  transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.9; }
.register-link {
  text-align: center; font-size: 14px; color: #6b7280;
}
.register-link a {
  color: #4b3ac3; text-decoration: none; font-weight: 600;
}
</style>
</head>
<body>

      <div class="scroll-area">
        <div class="header">
          <div class="logo-box"><span>H</span></div>
          <div class="app-title">Workmate</div>
          <div class="app-subtitle">HRIS Mobile</div>
        </div>

        <div class="error-box" id="errorBox">
          <span class="dot">&#9432;</span>
          <span class="msg" id="errorMsg"></span>
        </div>

        <div class="input-wrapper">
          <div class="input-label">NIK</div>
          <div class="input-container">
            <span class="input-icon">
              <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="16" rx="3"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
            </span>
            <input class="text-input" type="text" id="nik" placeholder="Masukkan NIK" autocomplete="off">
          </div>
        </div>

        <div class="input-wrapper">
          <div class="input-label">Password</div>
          <div class="input-container">
            <span class="input-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg>
            </span>
            <input class="text-input" type="password" id="password" placeholder="Masukkan Password">
            <button class="eye-btn" id="eyeBtn" onclick="togglePassword()">
              <svg viewBox="0 0 24 24" id="eyeOff"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              <svg viewBox="0 0 24 24" id="eyeOn" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <label class="remember-row" id="rememberRow">
          <input type="checkbox" id="remember" checked>
          <span class="checkbox-icon checked" id="checkIcon"></span>
          <span class="remember-label">Simpan login</span>
        </label>

        <button class="btn-primary" onclick="handleLogin()">Masuk</button>
        <div class="register-link">
          Belum punya akun? <a href="#">Daftar</a>
        </div>
      </div>
    </div>
    <div class="phone-home-bar"></div>
  </div>
</div>

<script>
function togglePassword() {
  var pwd = document.getElementById('password');
  var off = document.getElementById('eyeOff');
  var on = document.getElementById('eyeOn');
  if (pwd.type === 'password') {
    pwd.type = 'text'; off.style.display = 'none'; on.style.display = 'block';
  } else {
    pwd.type = 'password'; off.style.display = 'block'; on.style.display = 'none';
  }
}
document.getElementById('rememberRow').addEventListener('click', function(e) {
  if (e.target.tagName === 'INPUT') return;
  var cb = document.getElementById('remember');
  cb.checked = !cb.checked;
  var icon = document.getElementById('checkIcon');
  if (cb.checked) icon.classList.add('checked');
  else icon.classList.remove('checked');
});
function handleLogin() {
  var nik = document.getElementById('nik').value.trim();
  var pwd = document.getElementById('password').value.trim();
  var err = document.getElementById('errorBox');
  var msg = document.getElementById('errorMsg');
  if (!nik || !pwd) {
    msg.textContent = 'NIK dan Password wajib diisi';
    err.classList.add('visible');
  } else {
    err.classList.remove('visible');
  }
}
</script>
</body>
</html>
