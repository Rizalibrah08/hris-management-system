<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud HRIS - Login</title>
<style>
:root {
  --primary: #4b3ac3;
  --primary-hover: #3c2ea3;
  --primary-light: #eef2ff;
  --primary-light-hover: #e2e9ff;
  --bg-page: #f6f8ff;
  --bg-panel: #fff;
  --text-primary: #1d2340;
  --text-muted: #6b7280;
  --text-label: #6874a8;
  --text-sidebar-muted: rgba(255, 255, 255, 0.65);
  --border-light: #edf0fb;
  --border-input: #d1d5db;
  --green-bg: #d1fae5;
  --green-text: #065f46;
  --green-bg-soft: #ecfdf5;
  --red-bg: #fee2e2;
  --red-text: #991b1b;
  --red-bg-soft: #fff1f1;
  --amber-bg: #fef3c7;
  --amber-text: #92400e;
  --amber-bg-soft: #fff8e1;
  --blue-bg: #eef2ff;
  --blue-text: #3730a3;
  --sidebar-start: #4937bf;
  --sidebar-end: #31238c;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --shadow-panel: 0 8px 24px rgba(31, 49, 113, 0.06);
  --shadow-topbar: 0 10px 30px rgba(31, 49, 113, 0.08);
  --shadow-modal: 0 24px 44px rgba(17, 26, 58, 0.28);
  --transition-fast: 0.15s ease;
  --transition-normal: 0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg-page);
}

.login-card {
  width: min(420px, 92vw);
  background: var(--bg-panel);
  padding: 28px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-panel);
  display: grid;
  gap: 10px;
}

.login-card h2 {
  margin: 0;
}

.login-card p {
  margin: 0 0 8px;
  color: var(--text-muted);
  font-size: 14px;
}

.login-card label {
  font-size: 13px;
  color: var(--text-primary);
  font-weight: 500;
}

.login-card input {
  border: 1px solid var(--border-input);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition-fast);
}

.login-card input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(75, 58, 195, 0.1);
}

.login-card button {
  margin-top: 8px;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 11px 12px;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background var(--transition-fast);
}

.login-card button:hover {
  background: var(--primary-hover);
}

.login-card button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.remember-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
}

.remember-label {
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
}

.error {
  color: var(--red-text);
}
</style>
</head>
<body>
<div class="login-page">
  <form class="login-card" onsubmit="return false;">
    <h2>HRIS Login</h2>
    <p>Gunakan akun seed default untuk mulai eksplorasi backend.</p>
    <label for="nik">NIK</label>
    <input id="nik" value="EMP001" placeholder="Masukkan NIK">
    <label for="password">Password</label>
    <input id="password" type="password" value="" placeholder="Masukkan password">
    <div class="remember-row">
      <input id="remember" type="checkbox" checked>
      <label for="remember" class="remember-label">Simpan login</label>
    </div>
    <button type="submit">Masuk</button>
  </form>
</div>
</body>
</html>
