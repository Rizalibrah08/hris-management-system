services:
  web:
    volumes:
      - ./hris-web/backend/src:/app/backend/src
      - /app/backend/src/node_modules
    command: node backend/src/server.js

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./hris-web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - web
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  mysql:
    ports:
      - "3306:3306"