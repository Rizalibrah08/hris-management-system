name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - production
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    defaults:
      run:
        working-directory: ./hris-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./hris-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.skip_tests)

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.environment }}-${{ github.run_number }}
            type=raw,value=${{ inputs.environment }}-latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./hris-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build-docker
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Determine VPS connection
        id: vps
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "host=${{ secrets.PROD_IP }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.SSH_USER }}" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.ghcr.yml" >> $GITHUB_OUTPUT
            echo "app_dir=\$HOME/hris-prod" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.VPS_DEV_IP || secrets.PROD_IP }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.VPS_USER || secrets.SSH_USER }}" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.yml" >> $GITHUB_OUTPUT
            echo "app_dir=\$HOME/hris-dev" >> $GITHUB_OUTPUT
          fi
          echo "ghcr_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ steps.vps.outputs.host }}
          username: ${{ steps.vps.outputs.user }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ steps.vps.outputs.app_dir }}"
            COMPOSE_FILE="${{ steps.vps.outputs.compose_file }}"
            GHCR_REPO="${{ steps.vps.outputs.ghcr_repo }}"
            ENV="${{ inputs.environment }}"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Download compose file from GitHub
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ inputs.branch }}/${COMPOSE_FILE}" -o "${COMPOSE_FILE}"

            if [ "$ENV" = "production" ]; then
              # --- Production: GHCR pull (VPS no build) ---
              cat > .env << ENVEOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}
            DB_NAME=hris_db
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}
            JWT_EXPIRY=1d
            PORT=5000
            NODE_ENV=production
            GHCR_REPO=${GHCR_REPO}
            ENVEOF
              chmod 600 .env

              # Login GHCR (public repos may not need this, but safe to try)
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

              # Pull latest image & restart
              docker compose -f "${COMPOSE_FILE}" pull web
              docker compose -f "${COMPOSE_FILE}" up -d --remove-orphans
            else
              # --- Development: local build ---
              if [ ! -d ".git" ]; then
                git clone ${{ github.server_url }}/${{ github.repository }}.git .
                git checkout ${{ inputs.branch }}
              else
                git fetch origin
                git reset --hard origin/${{ inputs.branch }}
              fi

              cat > .env << ENVEOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD_DEV || secrets.DB_PASSWORD_PROD }}
            DB_NAME=hris_db
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            JWT_SECRET=${{ secrets.JWT_SECRET_DEV || secrets.JWT_SECRET_PROD }}
            JWT_EXPIRY=1d
            PORT=5000
            NODE_ENV=development
            ENVEOF
              chmod 600 .env

              # Build locally and start
              docker compose -f "${COMPOSE_FILE}" up -d --build --remove-orphans
            fi

            # Health check
            echo "Health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
                echo "Application is healthy!"
                break
              fi
              sleep 2
            done

            # Cleanup old images
            docker image prune -f
            echo "Deploy complete!"

      - name: Verify deployment
        run: |
          sleep 5
          HOST="${{ steps.vps.outputs.host }}"
          if [ -n "$HOST" ]; then
            curl -sf "http://${HOST}:5000/health" && echo " Remote health check passed!" || echo " Remote health check skipped (may be behind firewall/proxy)"
          fi

      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ steps.vps.outputs.ghcr_repo }}:${{ inputs.environment }}-latest" >> $GITHUB_STEP_SUMMARY
          echo "**Compose file:** ${{ steps.vps.outputs.compose_file }}" >> $GITHUB_STEP_SUMMARY