name: Deploy Mobile Update

on:
  push:
    branches: [main]
    paths:
      - 'hris-mobile/frontend/**'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hris-mobile/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hris-mobile/frontend/package-lock.json
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Publish OTA Update
        run: eas update --auto --branch production --message "${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
