name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'hris-web/backend/**'
      - 'hris-web/package.json'
      - 'hris-web/package-lock.json'

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hris-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hris-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Trigger Render Deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Wait for Render health check
        timeout-minutes: 5
        run: |
          for i in {1..30}; do
            echo "Checking health... attempt $i"
            if curl -sS --fail "https://${{ secrets.RENDER_SERVICE_URL }}/health"; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1
