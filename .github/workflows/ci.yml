name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Lint & Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hris-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hris-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Install Mobile Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hris-mobile/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hris-mobile/frontend/package-lock.json
      - run: npm ci
