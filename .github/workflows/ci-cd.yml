name: CI/CD Pipeline (GHCR)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'hris-web/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # JOB 1: TEST
  # =============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hris-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hris-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

  # =============================================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE ke GHCR
  # =============================================================================
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_ref: ghcr.io/${{ github.repository }}:${{ steps.branch.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set branch tag
        id: branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=develop" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}
            type=sha,prefix=${{ steps.branch.outputs.tag }}-

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./hris-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image info
        run: |
          echo "📦 Image: ghcr.io/${{ github.repository }}:${{ steps.branch.outputs.tag }}"
          echo "🔗 ghcr.io/${{ github.repository }}/pkgs/container/$(echo ${{ github.repository }} | cut -d/ -f2)"

  # =============================================================================
  # JOB 3: DEPLOY — VPS pull image dari GHCR
  # =============================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: https://${{ secrets.DOMAIN }}

    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Set deploy variables
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "vps_ip=${{ secrets.PROD_IP }}" >> $GITHUB_OUTPUT
            echo "db_pass=${{ secrets.DB_PASSWORD_PROD }}" >> $GITHUB_OUTPUT
            echo "jwt=${{ secrets.JWT_SECRET_PROD }}" >> $GITHUB_OUTPUT
            echo "app_dir=hris-prod" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "vps_ip=${{ secrets.STAGING_IP }}" >> $GITHUB_OUTPUT
            echo "db_pass=${{ secrets.DB_PASSWORD_STAGING }}" >> $GITHUB_OUTPUT
            echo "jwt=${{ secrets.JWT_SECRET_STAGING }}" >> $GITHUB_OUTPUT
            echo "app_dir=hris-staging" >> $GITHUB_OUTPUT
            echo "tag=develop" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vars.outputs.vps_ip }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/${{ steps.vars.outputs.app_dir }}

            # --- Step 1: Tulis .env dari GitHub Secrets ---
            cat > .env << ENVEOF
            DB_PASSWORD=${{ steps.vars.outputs.db_pass }}
            DB_NAME=hris_db
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            JWT_SECRET=${{ steps.vars.outputs.jwt }}
            JWT_EXPIRY=1d
            PORT=5000
            NODE_ENV=production
            GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            ENVEOF
            chmod 600 .env

            # --- Step 2: Pull compose file terbaru ---
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.ghcr.yml" -o docker-compose.ghcr.yml

            # --- Step 3: Login GHCR (baca dari .env) ---
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # --- Step 4: Pull image terbaru ---
            docker compose -f docker-compose.ghcr.yml pull web

            # --- Step 5: Rolling restart ---
            docker compose -f docker-compose.ghcr.yml up -d --remove-orphans

            # --- Step 6: Health check ---
            echo "⏳ Health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
                echo "✅ App healthy"
                break
              fi
              sleep 2
            done

            # --- Step 7: Cleanup old images ---
            docker image prune -f

            echo "✅ Deploy complete — ${{ steps.vars.outputs.tag }}"

      - name: Summary
        run: |
          echo "## 🚀 Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ steps.vars.outputs.vps_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ secrets.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
