name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'hris-web/**'
      - 'docker-compose*.yml'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'nginx/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'hris-web/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # JOB 1: TEST & BUILD
  # =============================================================================
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hris-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hris-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (non-blocking)
        run: npm run lint || true
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: hris-web/dist
          retention-days: 1

  # =============================================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # =============================================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write
      attestations: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./hris-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image info
        run: |
          echo "📦 Image: ${{ steps.meta.outputs.tags }}"

  # =============================================================================
  # JOB 3: DEPLOY TO STAGING (develop branch)
  # =============================================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: http://${{ secrets.STAGING_IP }}:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/hris-staging

            # Pull latest code
            git fetch origin develop
            git reset --hard origin/develop

            # Generate .env with GitHub secrets
            cat > .env << 'ENVEOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD_STAGING }}
            DB_NAME=hris_db
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            JWT_SECRET=${{ secrets.JWT_SECRET_STAGING }}
            PORT=5000
            NODE_ENV=staging
            ENVEOF

            # Build and start
            docker compose build web
            docker compose up -d --remove-orphans

            # Wait for healthy
            echo "⏳ Waiting for services..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
                echo "✅ Staging healthy"
                break
              fi
              sleep 2
            done

            # Show status
            docker compose ps
            docker compose logs web --tail 10

            # Cleanup
            docker image prune -f

      - name: Verify deployment
        run: |
          echo "🔗 Staging: http://${{ secrets.STAGING_IP }}:5000"

  # =============================================================================
  # JOB 4: DEPLOY TO PRODUCTION (main branch)
  # =============================================================================
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ secrets.PROD_DOMAIN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backup database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/hris-prod
            if docker compose ps mysql | grep -q "Up"; then
              docker compose exec -T mysql mysqldump -uroot -p"$DB_PASS" hris_db \
                > backups/db-$(date +%Y%m%d-%H%M%S).sql 2>/dev/null || echo "⚠️  Backup skipped"
              # Keep last 7 backups
              ls -t backups/db-*.sql 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null || true
              echo "✅ Backup created"
            fi
          env:
            DB_PASS: ${{ secrets.DB_PASSWORD_PROD }}

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/hris-prod

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Generate .env from GitHub secrets (never committed!)
            cat > .env << 'ENVEOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}
            DB_NAME=hris_db
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}
            PORT=5000
            NODE_ENV=production
            ENVEOF

            # Build new image
            docker compose build web

            # Rolling restart (new web container, keep mysql running)
            docker compose up -d --remove-orphans

            # Health check
            echo "⏳ Health check..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
                HEALTHY=1
                echo "✅ Production healthy"
                break
              fi
              sleep 2
            done

            if [ $HEALTHY -eq 0 ]; then
              echo "❌ Health check FAILED! Rolling back..."
              docker compose logs web --tail 50
              exit 1
            fi

            # Status
            docker compose ps

            # Cleanup old images (>24h)
            docker image prune -af --filter "until=24h"

      - name: Verify production
        run: |
          echo "🔗 Production: https://${{ secrets.PROD_DOMAIN }}"

  # =============================================================================
  # JOB 5: NOTIFICATION
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-prod]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status | Branch |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | ${{ needs.deploy-staging.result }} | develop |" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ needs.deploy-prod.result }} | main |" >> $GITHUB_STEP_SUMMARY
