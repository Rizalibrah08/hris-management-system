name: CI/CD Pipeline (GHCR)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy ke VPS? (develop = skip, main = auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - skip

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # JOB 1: TEST — selalu jalan di semua branch
  # =============================================================================
  test:
    name: 🔍 Test & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hris-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hris-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

  # =============================================================================
  # JOB 2: BUILD & PUSH — hanya jalan di branch main (production)
  # =============================================================================
  build:
    name: 📦 Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=latest-

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./hris-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image info
        run: |
          echo "📦 ghcr.io/${{ github.repository }}:latest"
          echo "🔗 https://github.com/${{ github.repository }}/pkgs/container/$(echo '${{ github.repository }}' | cut -d/ -f2)"

  # =============================================================================
  # JOB 3: DEPLOY — hanya jalan di branch main, auto deploy ke VPS
  # =============================================================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ secrets.DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/hris-prod

            # --- Tulis .env ---
            cat > .env << ENVEOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}
            DB_NAME=hris_db
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}
            JWT_EXPIRY=1d
            PORT=5000
            NODE_ENV=production
            GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            ENVEOF
            chmod 600 .env

            # --- Pull compose file terbaru ---
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.ghcr.yml" -o docker-compose.ghcr.yml

            # --- Login GHCR ---
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # --- Pull & restart ---
            docker compose -f docker-compose.ghcr.yml pull web
            docker compose -f docker-compose.ghcr.yml up -d --remove-orphans

            # --- Health check ---
            echo "⏳ Health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
                echo "✅ App healthy"
                break
              fi
              sleep 2
            done

            # --- Cleanup ---
            docker image prune -f
            echo "✅ Deploy complete!"

      - name: Summary
        run: |
          echo "## 🚀 Deployed to VPS" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ secrets.PROD_IP }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ secrets.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
