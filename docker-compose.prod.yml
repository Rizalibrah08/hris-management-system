  #     resources:
  #       limits:
  #         memory: 128m
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: '10m'
  #       max-file: '3'

volumes:
  mysql_data:
    driver: local

networks:
  internal:
    driver: bridge
