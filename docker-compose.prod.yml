# =============================================================================
# Docker Compose - Production
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Differences from docker-compose.yml:
#   - Resource limits (CPU/Memory)
#   - Log rotation (prevents disk fill)
#   - Read-only root filesystem (where possible)
#   - Health check on web container
#   - Security options (no-new-privileges, drop capabilities)
#   - Restart policy: always (cron-friendly)
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: hris-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    # --- Security ---
    security_opt:
      - seccomp:unconfined
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # --- Resource limits ---
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEM_LIMIT:-512m}
          cpus: ${MYSQL_CPU_LIMIT:-1.0}
    # --- Log rotation ---
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: ./hris-web
    container_name: hris-web
    restart: always
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-1d}
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "127.0.0.1:5000:5000"  # Bind to localhost only (nginx handles external)
    networks:
      - internal
    # --- Health check ---
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # --- Security ---
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.npm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # --- Resource limits ---
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-256m}
          cpus: ${WEB_CPU_LIMIT:-0.5}
    # --- Log rotation ---
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # --- Optional: Nginx Reverse Proxy with SSL ---
  # Uncomment this section and create nginx/nginx.conf + certs
